name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install app deps
        run: npm ci
      - name: Type-check & build PWA
        run: npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
      - name: Install & build functions
        run: |
          cd functions
          npm ci
          npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    # Only deploy on merge to main — PRs stop at build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
      - run: cd functions && npm ci && npm run build
      - name: Deploy to Firebase (production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: next-steps-maternal-prod
          channelId: live
      # Rules + functions ship via the CLI (the action above covers hosting).
      - name: Deploy Firestore rules, indexes & functions
        run: npx firebase-tools deploy --only firestore:rules,firestore:indexes,functions --project next-steps-maternal-prod --token "${{ secrets.FIREBASE_TOKEN }}"
