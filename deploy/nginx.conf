# ==============================================================================
# Next Steps Unified Host & Subdomains Configuration
# Target: 13.232.251.63 (AWS EC2)
# Co-hosts with: vda-admin.mdtlabs.org & vda-api.mdtlabs.org
# Domains: nextsteps.mdtlabs.org, nextsteps-admin.mdtlabs.org, nextsteps-api.mdtlabs.org
# ==============================================================================

# 1. Next Steps Web Admin & Frontline Web Portal
server {
    listen 80;
    server_name nextsteps.mdtlabs.org nextsteps-admin.mdtlabs.org 13.232.251.63 _;

    client_max_body_size 50M;

    # Admin Panel (Web based desktop / supervisor portal)
    location / {
        root /var/www/next-steps/admin-panel;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Redirect /admin to root
    location = /admin {
        return 301 /;
    }

    # Redirect /app to /app/ for relative asset resolution
    location = /app {
        return 301 /app/;
    }

    # Frontline Mobile Web App (Responsive PWA / Field Application)
    location /app/ {
        alias /var/www/next-steps/mobile-web/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # Direct Android APK Download links for frontline workers
    location = /apk {
        alias /var/www/next-steps/NextSteps-MaternalCare.apk;
        add_header Content-Disposition 'attachment; filename="NextSteps-MaternalCare.apk"';
        default_type application/vnd.android.package-archive;
    }

    location = /download {
        alias /var/www/next-steps/NextSteps-MaternalCare.apk;
        add_header Content-Disposition 'attachment; filename="NextSteps-MaternalCare.apk"';
        default_type application/vnd.android.package-archive;
    }

    # Backend API Proxy (Port 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend Health Check
    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
    }
}

# 2. Dedicated Next Steps API Subdomain (nextsteps-api.mdtlabs.org)
server {
    listen 80;
    server_name nextsteps-api.mdtlabs.org;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
